name: Build PSP EBOOT
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: pspdev/pspdev:latest
    steps:
      - uses: actions/checkout@v4
      - name: Check SDK
        run: |
          which psp-config || true
          psp-config --pspsdk-path || true
      - name: Build
        run: make
      - name: Upload EBOOT
        uses: actions/upload-artifact@v4
        with:
          name: EBOOT
          path: EBOOT.PBP
